# CodeRabbit review configuration for docktail-unraid.
#
# Unraid Docker plugin: shell installers/builders plus PHP status pages.
# Past security audits here were comment-heavy, so the bar is set at
# demonstrated defects, not style.
language: en-US
reviews:
  auto_review:
    drafts: false
  path_filters:
    - "!**/*.png"
    - "!**/*.md"
  path_instructions:
    - path: "**/*.sh"
      instructions: |
        Shell safety first: unquoted variables, missing set -euo pipefail,
        unguarded rm -rf, unchecked command failures, and curl-pipe-shell
        patterns. Judge the diff, not the surroundings.
    - path: "src/**"
      instructions: |
        Unraid plugin PHP pages: validate and escape all user input
        (XSS), never interpolate request data into shell commands.
        Only findings backed by a demonstrated defect are actionable.
