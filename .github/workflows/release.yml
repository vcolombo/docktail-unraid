name: Release

# `published` fires for both stable releases and pre-releases, so it is the only
# trigger needed. Listing `released` as well spawned a second, concurrent run
# that raced the first to push the rendered .plg to main and failed
# non-fast-forward. The action reads the prerelease flag itself.
on:
  release:
    types: [published]

# Belt and braces: never let two release runs push plugin files at once.
concurrency:
  group: release-plugin-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: dkaser/unraid-plugin-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plg_branch: main
          go_dir: docktail
          build_script: ./build.sh
          build_prereleases: true
